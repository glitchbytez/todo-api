spring:
  application:
    name: todo-api
  datasource:
    url: jdbc:postgresql://localhost:5432/tododb
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: none      # Flyway owns the schema now, Hibernate touches nothing
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html